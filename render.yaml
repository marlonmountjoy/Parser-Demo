services:
  - type: web
    name: seafood-ai-ops-demo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: AI_ESCALATION_THRESHOLD
        value: 0.85
